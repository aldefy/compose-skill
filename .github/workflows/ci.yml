name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq + bats
        run: sudo apt-get update && sudo apt-get install -y jq bats

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate plugin manifest schema
        run: bash scripts/validate-plugin-manifest.sh

      - name: Check SKILL.md description length (Codex/Copilot 1024-char cap)
        run: bash scripts/check-description-length.sh

      - name: Run manifest schema tests
        run: bats scripts/validate-plugin-manifest.bats

      - name: Run version-consistency tests
        run: bats scripts/check-versions.bats

  verify-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Compose layout claim tests
        run: ./gradlew :verify-claims:testDebugUnitTest --no-daemon

      - name: Upload verify-claims report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-claims-report
          path: |
            verify-claims/build/reports/tests/testDebugUnitTest/
            verify-claims/build/test-results/testDebugUnitTest/
